name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Check formatting
        run: pnpm format:check

      - name: Run typecheck, lint and tests
        run: pnpm check

      - name: Build packages (preview)
        env:
          APP_ENV: preview
          DATA_SOURCE: memory
        run: pnpm build

      - name: Build production front ends
        env:
          APP_ENV: production
          DATA_SOURCE: http
        run: |
          rm -rf apps/storefront/.next apps/dashboard/dist
          pnpm --filter @smartapp/storefront --filter @smartapp/dashboard build

      - name: Scan production build output
        run: node tooling/scan-build.ts
