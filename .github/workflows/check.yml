name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Check formatting
        run: pnpm format:check

      - name: Run typecheck, lint and tests
        run: pnpm check

      - name: Build packages (preview)
        env:
          APP_ENV: preview
          DATA_SOURCE: memory
        run: pnpm build

      - name: Build production front ends
        env:
          APP_ENV: production
          DATA_SOURCE: http
        run: |
          rm -rf apps/storefront/.next apps/dashboard/dist
          pnpm --filter @smartapp/storefront --filter @smartapp/dashboard build

      - name: Scan production build output
        run: node tooling/scan-build.ts

  screenshots:
    name: Screenshots
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Chromium browser matches pinned version
        run: pnpm --filter @smartapp/tooling exec playwright install chromium

      - name: Build shared workspace packages
        run: pnpm --filter @smartapp/core --filter @smartapp/data build

      - name: Run visual screenshot tests and the responsive UI scan
        run: pnpm --filter @smartapp/tooling exec playwright test -c e2e/playwright.config.ts

      - name: Upload UI scan report and page screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-scan-report
          path: tooling/e2e/test-results/ui-scan
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload screenshot diff report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-screenshot-diffs
          path: |
            tooling/e2e/playwright-report
            tooling/e2e/test-results
          retention-days: 14
