name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Check formatting
        run: pnpm format:check

      - name: Run typecheck, lint and tests
        run: pnpm check

      - name: Build packages
        run: pnpm build

      - name: Scan build output for development addresses
        run: |
          if grep -rnE "localhost:3100|localhost:5174|localhost:4100|127\.0\.0\.1" apps/dashboard/dist apps/storefront/.next --exclude="*.map" --exclude-dir=cache; then
            echo "Dev address found in a production build"
            exit 1
          fi
