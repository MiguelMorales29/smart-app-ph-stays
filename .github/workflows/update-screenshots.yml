name: Update screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-screenshots:
    name: Update screenshots
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Chromium browser matches pinned version
        run: pnpm --filter @smartapp/tooling exec playwright install chromium

      - name: Build shared workspace packages
        run: pnpm --filter @smartapp/core --filter @smartapp/data build

      - name: Update screenshot baselines
        run: pnpm --filter @smartapp/tooling exec playwright test -c e2e/playwright.config.ts screenshots.e2e.ts --update-snapshots

      - name: Commit and push updated baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory '*'
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add tooling/e2e/__screenshots__
          if git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
            echo "No screenshot baseline changes to commit."
            exit 0
          fi
          git -C "$GITHUB_WORKSPACE" commit -m "chore(e2e): update screenshot baselines"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:${{ github.ref_name }}
